version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: himal-ride-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: himalride
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - himal-ride-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: himal-ride-backend
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/himalride
      - SECRET_KEY=dev-secret-key-not-for-production
      - APP_ENV=development
      - DEBUG=true
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv # Exclude venv from mount
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - himal-ride-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: himal-ride-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: pnpm dev --host 0.0.0.0
    networks:
      - himal-ride-network

volumes:
  postgres_data:

networks:
  himal-ride-network:
    driver: bridge
